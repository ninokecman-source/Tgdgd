# Nginx vhost za web pregled. Cliniko zadrzava svoje vhostove nedirnute -
# ovo je zaseban server blok, prepoznaje se po server_name.
#
#   sudo cp ~emmett/Tgdgd/web/nginx-emmett.conf /etc/nginx/sites-available/emmett
#   sudo ln -s /etc/nginx/sites-available/emmett /etc/nginx/sites-enabled/
#   # upisi svoju adresu umjesto PROMIJENI.primjer.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d PROMIJENI.primjer.com
#
# certbot sam dopise HTTPS dio i preusmjeravanje s porta 80.

server {
    listen 80;
    listen [::]:80;
    server_name PROMIJENI.primjer.com;

    # Kroz stranicu idu imena, adrese i mailovi polaznika - nista od toga ne
    # smije u tudji okvir, u povijest preporuke ni u indeks pretrazivaca.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
